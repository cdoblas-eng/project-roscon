<div class="container">
    <div class="form-group d-inline-flex">
        <input
                type="text"
                style="padding:8px;margin:8px auto;width:50vh;"
                [(ngModel)]="filterValue"
                placeholder="Introduce un valor para filtrar"
                class="form-control"
                (keyup)="updateFilter()"
        />

        <select [(ngModel)]="filterColumn" style="padding:8px;margin:8px auto;width:50vh;" (change)="updateFilter()"
                name="special-ins2" id="special-ins2"
                class="form-control text-uppercase text-center">
            <option value="" selected>Filtro por columna</option>

            <option
                    *ngFor="let column of columns"
                    [value]="column.prop">
                {{ column.name }}
            </option>
        </select>
        <div class="align-content-center px-2">Especiales</div>
        <div class="align-content-center px-2"><mat-slide-toggle [ngModel]="specialFilter"  (change)="changeSpecialFilter()"></mat-slide-toggle></div>
        <div class="align-content-center px-2">Notas</div>
        <div class="align-content-center px-2"><mat-slide-toggle [ngModel]="noteFilter"  (change)="changeNoteFilter()"></mat-slide-toggle></div>
    </div>
    <ngx-datatable
            class="material"
            [rows]="rows"
            [columns]="columns"
            [columnMode]="'force'"
            [headerHeight]="50"
            [footerHeight]="50"
            [rowHeight]="'auto'"
            [limit]="8"
    >
        <ngx-datatable-column *ngFor="let col of columns" [name]="col.name" [prop]="col.prop">
            <ng-template ngx-datatable-cell-template let-row="row" let-value="value" let-col="column">
                <ng-container *ngIf="col.prop === 'vendido'">
                    <span [ngClass]="{ 'vendido-true': isVendido(value), 'vendido-false': !isVendido(value) }">
                      {{ isVendido(value) ? 'Entregado' : 'Pendiente' }}
                    </span>
                </ng-container>
                <ng-container *ngIf="col.prop !== 'vendido'">
                    {{ value }}
                </ng-container>
            </ng-template>
        </ngx-datatable-column>
    </ngx-datatable>
</div>
